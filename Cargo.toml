[workspace]
resolver = "2"
members = ["crates/engine", "crates/otl"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/weizhesafeheron/outline-cli"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
# NOTE: story file says feature "rustls-tls" (the reqwest 0.12 name); in
# reqwest 0.13 the rustls backend feature is named "rustls", with
# "webpki-roots" providing the trust roots.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "webpki-roots",
] }
clap = { version = "4.6", features = ["derive"] }
httpdate = "1.0"
# Credential file + OAuth (otl only; the engine stays service-agnostic).
toml = "1"
directories = "6"
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.4"
# Advisory file locks (refresh single-flight). Pure Rust, no libc, so it
# needs no `unsafe` on our side; `std::fs::File::lock` would raise the
# workspace MSRV from 1.85 to 1.89, which is not this epic's call to make.
fs4 = "1.1"
# Terminal column width of a string is not its char count (CJK is 2
# columns wide, combining marks 0); table alignment depends on this.
unicode-width = "0.2"
# Emoji ligatures (ZWJ sequences, skin-tone modifiers) are one grapheme
# cluster of width 2, not the sum of their codepoints' widths.
unicode-segmentation = "1.12"

# dev / test
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Release profile tuned for binary size and cold-start time (SPEC: <10ms
# startup, ~5MB binary). `panic = "abort"` is safe for `cargo test --release`
# because Cargo forces unwind when building test harnesses.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
