[workspace]
resolver = "2"
members = ["crates/engine", "crates/otl"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/weizhesafeheron/outline-cli"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
# NOTE: story file says feature "rustls-tls" (the reqwest 0.12 name); in
# reqwest 0.13 the rustls backend feature is named "rustls", with
# "webpki-roots" providing the trust roots.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "webpki-roots",
] }
clap = { version = "4.6", features = ["derive"] }
httpdate = "1.0"
# Terminal column width of a string is not its char count (CJK is 2
# columns wide, combining marks 0); table alignment depends on this.
unicode-width = "0.2"
# Emoji ligatures (ZWJ sequences, skin-tone modifiers) are one grapheme
# cluster of width 2, not the sum of their codepoints' widths.
unicode-segmentation = "1.12"
# Unicode normalization for export file names: NFC and NFD spellings of the
# same title are ONE directory entry on macOS, so the de-duplication key has
# to be normalization-insensitive.
unicode-normalization = "0.1"
# Terminal height, to decide whether `docs view` output exceeds one screen.
# There is no std API for this and the alternative (an ioctl) needs unsafe,
# which both crates forbid.
terminal_size = "0.4"

# dev / test
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Release profile tuned for binary size and cold-start time (SPEC: <10ms
# startup, ~5MB binary). `panic = "abort"` is safe for `cargo test --release`
# because Cargo forces unwind when building test harnesses.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
