[workspace]
resolver = "2"
members = ["crates/engine", "crates/otl"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
# NOTE: story file says feature "rustls-tls" (the reqwest 0.12 name); in
# reqwest 0.13 the rustls backend feature is named "rustls", with
# "webpki-roots" providing the trust roots.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
    "webpki-roots",
] }
clap = { version = "4.6", features = ["derive"] }

# dev / test
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Release profile tuned for binary size and cold-start time (SPEC: <10ms
# startup, ~5MB binary). `panic = "abort"` is safe for `cargo test --release`
# because Cargo forces unwind when building test harnesses.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
