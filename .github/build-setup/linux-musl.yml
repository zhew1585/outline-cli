# Extra steps cargo-dist injects into every build-local-artifacts job of
# the generated release workflow (`github-build-setup` in
# dist-workspace.toml).
#
# The fragment deliberately lives OUTSIDE .github/workflows: GitHub tries
# to parse every .yml in that directory as a workflow and would report a
# bare step list as an invalid workflow file. dist resolves the configured
# path relative to .github/workflows, hence the `../` in the config.
#
# It replaces dist's own `[dist.dependencies.apt]`, which emits
# `sudo apt-get install <pkgs>` with no `--yes`; a GitHub Actions `run:`
# step has stdin on /dev/null, so apt's confirmation prompt would read EOF
# and abort the release. The package list itself lives in the script so the
# release build and the pre-merge musl build in release-guards.yml share
# one definition.
#
# Gated on the runner OS so the macOS and Windows build jobs skip it.
- name: install musl cross toolchain (Linux release builds)
  if: runner.os == 'Linux'
  shell: bash
  run: bash scripts/install-linux-musl-toolchain.sh
