# Release preflight (Story 4.5).
#
# Registered as a cargo-dist `local-artifacts-jobs` custom job, so on a
# release tag it runs as `custom-release-guards` alongside the build matrix.
# That registration is deliberate and load-bearing: dist's `host` job lists
# `local-artifacts-jobs` in `needs` and requires skipped-or-success from
# each, so a failure here skips `host`, which skips
# `publish-homebrew-formula` (no `always()`) and `announce` (which requires
# host success) - and with `github-release = "announce"` the GitHub Release
# is created in `announce`, so nothing is published.
#
# It must NOT be a `plan-jobs` job. A failing plan job leaves the build jobs
# *skipped*, and `host` is guarded by
# `always() && ... (result == 'skipped' || result == 'success')` - skipped
# passes. `host-jobs` is wrong in a different way: `announce` ignores their
# result, so they cannot stop a Release, but `publish-homebrew-formula` does
# list them in `needs` without an `always()`, so they *can* skip the formula
# push - the worst of both. dist-workspace.toml carries the full slot map.
# scripts/check-release-gating.sh asserts this chain so it cannot regress
# silently.
#
# The binary-size budget is not here: it must fail *the build job* itself,
# see .github/build-setup/release-build-setup.yml.
#
# Everything here is either impossible to check from the generated files
# alone, or a property of them that `dist generate --check` does not cover.
#
# Phone-home policy (NFR4): only standard actions, pinned to full commit
# SHAs, plus the cargo-dist installer - which this job verifies against a
# checksum committed in the repo before running it.
#
# NOTE on dtolnay/rust-toolchain: when pinned to a SHA the toolchain is no
# longer carried by the ref, so `with: toolchain: stable` is mandatory.
name: Release guards

on:
  # Called by the generated release workflow as a release gate. dist passes
  # the plan manifest to `local-artifacts-jobs` jobs, so the input has to be
  # declared even though nothing here reads it - GitHub rejects a call with
  # an undeclared input.
  workflow_call:
    inputs:
      plan:
        description: "dist-manifest JSON produced by the plan job (unused)"
        required: false
        type: string
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release-config:
    name: cargo-dist config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: verify and install cargo-dist
        shell: bash
        run: |
          # The generated release workflow installs dist by piping a remote
          # script into a shell with no integrity check, which dist offers
          # no way to configure (axodotdev/cargo-dist#2420). This job
          # verifies the exact bytes against scripts/cargo-dist-installers.sha256
          # first and then runs the copy it verified - never a second
          # download - so a swapped installer fails here and, because every
          # release job needs this one, nothing is published.
          set -euo pipefail
          INSTALLER_OUT_DIR="${RUNNER_TEMP}/dist-installer" \
            bash scripts/verify-cargo-dist-installer.sh
          sh "${RUNNER_TEMP}/dist-installer/cargo-dist-installer.sh"

      - name: dist plan
        run: dist plan --output-format=json > dist-plan.json

      - name: generated files are in sync with the config
        # Fails if .github/workflows/release.yml was hand-edited or left
        # stale after a config change. Fix by running `dist generate` and
        # committing the result. (The MSI definition is excluded from this
        # check on purpose - `allow-dirty = ["msi"]` - because main.wxs
        # carries a hand-applied AllowSameVersionUpgrades; its invariants
        # are asserted separately below.)
        run: dist generate --check

      - name: the release gates can actually stop a release
        # Asserts the needs/if chain in the generated workflow: that a
        # failure of this job blocks `host`, that a build-job failure does
        # too, that the compile job still has a read-only token, and that
        # the Release is created in `announce`. All of that is template
        # behaviour `dist generate --check` would happily accept changing.
        run: bash scripts/check-release-gating.sh

      - name: WiX definition has not drifted from dist's template
        # main.wxs is excluded from `dist generate --check` (allow-dirty), so
        # regenerate it without that exclusion and allow only the one delta
        # we applied on purpose.
        run: bash scripts/check-wxs-drift.sh

      - name: no updater artifact (NFR4, no phone home)
        shell: bash
        run: |
          # `install-updater = false` is load-bearing, not cosmetic: the
          # updater axodotdev ships polls a release server behind the
          # user's back. Assert no updater artifact is planned, so turning
          # the option back on cannot pass review silently.
          set -euo pipefail
          if grep -iE '"[^"]*(updater|axoupdater)[^"]*"' dist-plan.json; then
            echo "::error::an updater artifact appeared in the dist plan; NFR4 forbids phone-home behaviour"
            exit 1
          fi
          echo "no updater artifact in the release plan"

      - name: all three platforms and all three installers are planned
        shell: bash
        run: |
          # Guards the acceptance criteria themselves: AC1 asks for a brew
          # tap, a shell installer and a Windows MSI; NFR3 asks for three
          # first-class platforms. A dropped target or installer silently
          # narrows the release, so assert the plan by name.
          set -euo pipefail
          expected=(
            "outline-cli-installer.sh"
            "outline-cli.rb"
            "outline-cli-x86_64-pc-windows-msvc.msi"
            "outline-cli-aarch64-apple-darwin.tar.xz"
            "outline-cli-x86_64-apple-darwin.tar.xz"
            "outline-cli-x86_64-unknown-linux-musl.tar.xz"
          )
          missing=0
          for artifact in "${expected[@]}"; do
            if grep -qF "\"${artifact}\"" dist-plan.json; then
              echo "ok: ${artifact}"
            else
              echo "::error::release plan is missing ${artifact}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: every third-party action is pinned to a commit SHA
        # The hand-written workflows pin SHAs by convention; the generated
        # one only does because `[dist.github-action-commits]` tells it to,
        # and a dist upgrade introducing a new action would silently
        # reintroduce a movable tag. Assert the property rather than trust
        # the config.
        shell: bash
        run: bash scripts/check-action-pins.sh

      - name: MSI version and upgrade semantics
        shell: bash
        run: |
          # Two Windows-only failure modes that would otherwise surface
          # halfway through a real release:
          #   1. a prerelease version cargo-wix cannot map onto the MSI's
          #      fourth version field (hard error on the Windows runner);
          # (main.wxs itself is covered by check-wxs-drift.sh above.)
          set -euo pipefail
          bash scripts/check-msi-version.sh
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bash scripts/check-msi-version.sh "${GITHUB_REF_NAME}"
          fi

      - name: homebrew tap is reachable
        # Never on a pull request. The step is advisory-only outside a tag,
        # so a PR run would gain nothing while moving a PAT that can write to
        # the tap into an environment any branch author controls. Same
        # trust-from-the-ref rule ci.yml uses for its contract job.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # The homebrew publish job checks out an external repository with
          # a PAT. Both live outside this repo, so a missing token or a
          # missing tap can only be discovered by asking - and asking after
          # the release is built is too late. On a tag this is fatal; on a
          # branch or pull request (where forks legitimately have no
          # secrets) it is advisory.
          set -euo pipefail
          tap="$(sed -n 's/^tap *= *"\([^"]*\)".*/\1/p' dist-workspace.toml)"
          if [ -z "${tap}" ]; then
            echo "no homebrew tap configured; nothing to check"
            exit 0
          fi
          # `tap = "owner/name"` maps to the repository "owner/homebrew-name"
          # unless the name already carries the prefix.
          owner="${tap%%/*}"; name="${tap##*/}"
          case "${name}" in homebrew-*) repo="${owner}/${name}" ;; *) repo="${owner}/homebrew-${name}" ;; esac

          fatal=0
          [ "${GITHUB_REF_TYPE}" = "tag" ] && fatal=1

          fail() {
            if [ "${fatal}" -eq 1 ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            fail "HOMEBREW_TAP_TOKEN is not configured, so publishing to ${repo} would fail"
          fi

          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${repo}")"
          if [ "${status}" != "200" ]; then
            fail "the tap repository ${repo} is not reachable with HOMEBREW_TAP_TOKEN (HTTP ${status})"
          fi
          echo "ok: ${repo} is reachable with the configured token"
