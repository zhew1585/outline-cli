# Release guards (Story 4.5). Everything about the release pipeline that
# can be checked *before* someone pushes a tag.
#
# Why this is a separate workflow from release.yml: release.yml is
# generated byte-for-byte by `dist generate` and is verified against
# dist-workspace.toml here, so it must not be hand-edited. And it is
# deliberately tag-only (`pr-run-mode = "skip"`), so without this workflow
# a broken release config would only surface at tag time, when it is most
# expensive.
#
# Phone-home policy (NFR4): only standard actions (checkout,
# rust-toolchain, rust-cache) plus the pinned cargo-dist installer - no
# telemetry, no update checks. Third-party actions are pinned to full
# commit SHAs, matching ci.yml.
#
# NOTE on dtolnay/rust-toolchain: when pinned to a SHA the toolchain is no
# longer carried by the ref, so `with: toolchain: stable` is mandatory.
name: Release guards

on:
  push:
    branches: [main, develop]
    # Same tag pattern as the generated release workflow, so a tagged build
    # is size-gated too (Story 4.5 AC2: "release build, CI checks").
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  binary-size:
    # NFR2: single static binary, ~5 MB target. The gate itself (threshold
    # and its justification) lives in scripts/check-binary-size.sh so it is
    # runnable locally with the identical value.
    #
    # NFR3: all three platforms are measured, and each one measures the
    # triple that is actually published - notably the Linux job builds the
    # musl target, which doubles as a pre-merge proof that the statically
    # linked release build still works (aws-lc-sys compiles C, so a musl
    # build is not a foregone conclusion).
    name: binary size gate (${{ matrix.target || matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: ""
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install musl cross toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: bash scripts/install-linux-musl-toolchain.sh
      - name: check binary size
        # bash on all three runners (Git Bash on windows-latest): the script
        # probes for both `otl` and `otl.exe`.
        shell: bash
        env:
          BINARY_SIZE_TARGET: ${{ matrix.target }}
        run: bash scripts/check-binary-size.sh

  release-config:
    # The cargo-dist config is only as good as its agreement with the
    # workflow it generates and with the artifact list it promises.
    name: cargo-dist config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: install dist (version pinned by dist-workspace.toml)
        shell: bash
        run: |
          # Read the pinned version out of the config instead of repeating
          # it here: a mismatch between the tool that validates the config
          # and the tool CI releases with would defeat the point.
          set -euo pipefail
          version="$(sed -n 's/^cargo-dist-version *= *"\([^"]*\)".*/\1/p' dist-workspace.toml)"
          if [[ -z "${version}" ]]; then
            echo "::error::could not read cargo-dist-version from dist-workspace.toml"
            exit 1
          fi
          echo "installing cargo-dist ${version}"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${version}/cargo-dist-installer.sh" | sh
      - name: dist plan
        run: dist plan --output-format=json > dist-plan.json
      - name: generated release workflow is in sync with the config
        # Fails if .github/workflows/release.yml (or the generated
        # wix definition) was hand-edited or left stale after a config
        # change. Fix by running `dist generate` and committing the result.
        run: dist generate --check
      - name: no updater artifact (NFR4, no phone home)
        shell: bash
        run: |
          # `install-updater = false` is load-bearing, not cosmetic: the
          # updater axodotdev ships polls a release server behind the
          # user's back. Assert no updater artifact is planned, so turning
          # the option back on cannot pass review silently.
          set -euo pipefail
          if grep -iE '"[^"]*(updater|axoupdater)[^"]*"' dist-plan.json; then
            echo "::error::an updater artifact appeared in the dist plan; NFR4 forbids phone-home behaviour"
            exit 1
          fi
          echo "no updater artifact in the release plan"
      - name: all three platforms and all three installers are planned
        shell: bash
        run: |
          # Guards the acceptance criteria themselves: AC1 asks for a brew
          # tap, a shell installer and a Windows MSI; NFR3 asks for three
          # first-class platforms. A dropped target or installer silently
          # narrows the release, so assert the plan by name.
          set -euo pipefail
          expected=(
            "outline-cli-installer.sh"
            "outline-cli.rb"
            "outline-cli-x86_64-pc-windows-msvc.msi"
            "outline-cli-aarch64-apple-darwin.tar.xz"
            "outline-cli-x86_64-apple-darwin.tar.xz"
            "outline-cli-x86_64-unknown-linux-musl.tar.xz"
          )
          missing=0
          for artifact in "${expected[@]}"; do
            if grep -qF "\"${artifact}\"" dist-plan.json; then
              echo "ok: ${artifact}"
            else
              echo "::error::release plan is missing ${artifact}"
              missing=1
            fi
          done
          exit "${missing}"
