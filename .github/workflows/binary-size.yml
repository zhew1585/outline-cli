# Pre-merge binary size feedback (Story 4.5, NFR2/NFR3).
#
# This workflow is NOT what gates the release - a workflow triggered by the
# same tag runs in parallel with the release and could only turn itself red.
# The blocking gate is a step inside dist's own `build-local-artifacts` job,
# injected via .github/build-setup/release-build-setup.yml, whose failure
# skips `host` and therefore `announce`. See that file for the chain.
#
# What this one is for: catching a size regression, and a broken musl build,
# in the pull request that causes them rather than at tag time. Same script,
# same threshold, so the two can never disagree.
#
# Phone-home policy (NFR4): only standard actions, all pinned to full commit
# SHAs, matching ci.yml.
#
# NOTE on dtolnay/rust-toolchain: when pinned to a SHA the toolchain is no
# longer carried by the ref, so `with: toolchain: stable` is mandatory.
name: Binary size

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  binary-size:
    # Each runner names the triple it publishes explicitly rather than
    # relying on the host default, because dist always passes `--target` and
    # a target-less build lands in a different directory with a different
    # cargo fingerprint. Naming it keeps what a pull request measures
    # identical to what the release measures.
    #
    # The Linux job builds musl, which doubles as a pre-merge proof that the
    # statically linked release build still works - not a formality, since
    # rustls' crypto provider (aws-lc-sys) compiles C and has to cross the
    # libc boundary.
    name: binary size (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: install musl cross toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: bash scripts/install-linux-musl-toolchain.sh
      - name: check binary size
        # bash on all three runners (Git Bash on windows-latest): the script
        # probes for both `otl` and `otl.exe`.
        shell: bash
        env:
          BINARY_SIZE_TARGET: ${{ matrix.target }}
        run: bash scripts/check-binary-size.sh
