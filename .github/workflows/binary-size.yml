# Pre-merge binary size feedback.
#
# This workflow is NOT what gates the release - a workflow triggered by the
# same tag runs in parallel with the release and could only turn itself red.
# The blocking gate is a step inside dist's own `build-local-artifacts` job,
# injected via .github/build-setup/release-build-setup.yml, whose failure
# skips `host` and therefore `announce`. See that file for the chain.
#
# What this one is for: catching a size regression in the pull request that
# causes it rather than at tag time. Same script, same budgets, so the two
# can never disagree.
#
# Both shipped triples are measured. x86_64-apple-darwin is a cross-build
# from the arm64 runner - it was previously left out only because it happened
# to be measurable on a developer's machine, which is not a reason for CI to
# skip a target we publish.
#
# Phone-home policy: only standard actions, all pinned to full commit
# SHAs, matching ci.yml.
#
# NOTE on dtolnay/rust-toolchain: when pinned to a SHA the toolchain is no
# longer carried by the ref, so `with: toolchain: stable` is mandatory.
name: Binary size

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  binary-size:
    # Each runner names the triple it publishes explicitly rather than
    # relying on the host default, because dist always passes `--target` and
    # a target-less build lands in a different directory with a different
    # cargo fingerprint. Naming it keeps what a pull request measures
    # identical to what the release measures.
    name: binary size (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: check binary size
        # `shell: bash` is explicit so this keeps working unchanged if a
        # non-Unix runner is ever added back to the matrix.
        shell: bash
        env:
          BINARY_SIZE_TARGET: ${{ matrix.target }}
        run: bash scripts/check-binary-size.sh
