# cargo-dist configuration (Story 4.5: release pipeline).
#
# One config produces every distribution channel the spec asks for
# (specs/spec-outline-cli/stack.md "分发"):
#   * shell installer  -> curl | sh
#   * homebrew formula -> pushed to the tap named below
#
# Phone-home policy (NFR4): `install-updater = false` on purpose. The
# updater axodotdev ships would contact a release server behind the user's
# back, which this project forbids. Do not turn it on.
#
# Regenerating: this file is the source of truth for
# `.github/workflows/release.yml`, which is generated and must never be
# hand-edited. After editing this file run
#   dist generate
# and commit the result. Do NOT run `dist init --yes` to regenerate: it
# rewrites `targets` with its own defaults, re-adding triples this project
# deliberately does not ship. CI (.github/workflows/release-guards.yml)
# verifies config and generated files agree via `dist generate --check`.


[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. No `msi`: dist only builds one for
# a Windows target, and none is published. No `powershell` either - it was
# never enabled, and a PowerShell installer that fetches macOS archives would
# be meaningless.
installers = ["shell", "homebrew"]
# Homebrew tap the generated formula is pushed to by the `homebrew` publish
# job. Two prerequisites live outside this repository and NEITHER EXISTS YET
# (2026-08):
#   1. the tap repo `zhew1585/homebrew-tap` has to be created;
#   2. a `HOMEBREW_TAP_TOKEN` repository secret needs `contents: write` on it.
#
# Until both are in place a version tag fails fast and publishes nothing: the
# release-guards preflight resolves this value to `zhew1585/homebrew-tap`,
# asks the GitHub API whether the configured token can see it, and treats a
# negative answer as fatal on a tag. That failure skips `host`, so no
# artifacts are uploaded and no Release is created.
#
# (An earlier version of this comment claimed the release would "still
# succeed up to the publish step" with the .rb attached. That stopped being
# true when `github-release = "announce"` moved Release creation behind a
# successful publish - there is no longer any path that produces a Release
# without the formula having been pushed.)
tap = "zhew1585/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# macOS only, for now (Story 4.7). Both Apple triples ship: Intel Macs are
# still in use, and dropping x86_64 would silently strand them.
#
# Deliberately NOT universal2-apple-darwin, which would look tidier: a fat
# binary carries both slices, so it would measure ~7.5 MB against NFR2's
# ~5 MB promise. Two thin artifacts keep the promise; one fat one breaks it.
#
# Keep this list in sync with the platform matrix in README.md ("Install")
# and with the per-target budgets in scripts/check-binary-size.sh -
# scripts/check-release-gating.sh asserts the latter and will fail if a
# target is added here without a measured budget.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Releasing is a tag-only activity: the generated workflow must not fire on
# pull requests. The equivalent pre-merge validation lives in the two
# hand-written workflows (release-guards.yml, binary-size.yml), which run on
# pull requests under their own triggers, so nothing is lost by skipping.
pr-run-mode = "skip"

# Create the GitHub Release in the `announce` job rather than in `host`.
#
# This is an ordering fix, not a preference. `announce` runs only when
# `host` succeeded AND the Homebrew publish job succeeded or was skipped, so
# a missing tap repository, a missing or expired HOMEBREW_TAP_TOKEN, or any
# other publish failure now leaves *no* public release behind. With the
# default ("auto", i.e. create during `host`) the release would already be
# published and visible before the formula was pushed, so a publish failure
# would strand users on an install channel the README advertises.
github-release = "announce"

# GitHub artifact attestations: signed, verifiable build provenance for the
# release binaries (`gh attestation verify <file> --repo ...`), so a
# consumer can check an artifact really came from this workflow in this
# repository and not merely that it matches a checksum generated by the same
# possibly-compromised job.
#
# It has a second, larger effect: enabling attestations in the default
# `build-local-artifacts` phase makes dist give that job an explicit
# `permissions: { attestations: write, contents: read, id-token: write }`.
# That is the only supported way to take the writable GITHUB_TOKEN away from
# the job that compiles the crate graph - i.e. the job where a dependency's
# build script runs. The workflow-level `contents: write` is hardcoded in
# dist's template and cannot be lowered from configuration
# (cargo-dist 0.32.0, backend/ci/github.rs: `root_permissions`), so this is
# as close to least privilege as the tool allows today.
github-attestations = true

# Release preflight. Registered as a `local-artifacts-jobs` job, NOT a
# `plan-jobs` one, and the difference is the whole point.
#
# dist's `host` job is guarded by
#   always() && ... && (needs.X.result == 'skipped' || needs.X.result == 'success')
# so a *skipped* dependency passes and only a *failure* blocks. A plan job
# that fails leaves the build jobs skipped, not failed, and `host` then runs
# anyway - taking `publish-homebrew-formula` (writable tap PAT, third-party
# Ruby) with it. `host` does list `local-artifacts-jobs` in `needs` and does
# demand skipped-or-success from each, so a failure here genuinely stops the
# release. `host-jobs` would NOT work either: `announce` lists them in
# `needs` but its `if` uses `always()` and never checks their result.
#
# It still starts at the same moment - the job only needs `plan`, so it runs
# alongside the build matrix rather than after it.
#
# scripts/check-release-gating.sh asserts this chain against the generated
# workflow, so a cargo-dist upgrade cannot quietly undo it.
local-artifacts-jobs = ["./release-guards"]

# Attest the global artifacts (shell installer, Homebrew formula,
# sha256.sum, source tarball). dist only attests *local* artifacts, and only
# when `github-attestations-phase` is left at its default - and that same
# default is what gives build-local-artifacts its read-only token, so the
# phase cannot be moved to cover the globals without handing the compile job
# a writable token back. A custom job gets both properties.
#
# `post-announce-jobs` is the ONLY slot where a custom job cannot interfere
# with publishing, which matters because attesting is additive: failing to
# attest must never turn a good build into a broken release. Complete map of
# what consumes each slot in cargo-dist 0.32.0 (grepped across
# templates/ci/github/ *including the partials* - checking only
# release.yml.j2 is how this was got wrong once):
#
#   plan-jobs             build-local `needs`            -> skip, host tolerates
#   local-artifacts-jobs  host `needs` AND `if`          -> BLOCKS host
#   global-artifacts-jobs host `needs` AND `if`          -> BLOCKS host
#   host-jobs             announce `needs`,              -> BLOCKS publish
#                         publish_homebrew/npm `needs`      (no `always()`)
#   user-publish-jobs     announce `needs` AND `if`      -> BLOCKS announce
#   post-announce-jobs    nothing needs it               -> blocks nothing
#
# host-jobs specifically would recreate the half-published state that
# `github-release = "announce"` exists to prevent: a failed attestation
# skips publish-homebrew-formula, and announce's `if` treats a skipped
# publish as success, so the Release goes public with no formula in the tap.
# scripts/check-release-gating.sh now asserts no attestation job can block
# publishing, whichever slot it is moved to.
post-announce-jobs = ["./attest-global-artifacts"]

# Custom jobs get no special permissions by default; attestation needs
# these, and nothing else. Inline table on purpose: a `[dist.<table>]`
# section header here would swallow every key defined after it.
github-custom-job-permissions = { attest-global-artifacts = { id-token = "write", attestations = "write", contents = "read" } }


# Extra steps injected into the `build-local-artifacts` job: the structural
# assertions and the binary-size budget, both of which must fail *that* job
# in order to actually block a release. See the fragment's own header. The
# path is resolved relative to .github/workflows/.
github-build-setup = "../build-setup/release-build-setup.yml"

# Pin every action the generated workflow uses to an immutable commit rather
# than the movable major-version tags dist emits by default. Release jobs
# hold a writable GITHUB_TOKEN, and the Homebrew step additionally checks
# out an external repository with a PAT, so a retagged action would run with
# real publishing credentials.
#
# Resolved 2026-08 from the tags dist requests; refresh together with
# `cargo-dist-version`, and re-run `dist generate` afterwards.
# scripts/check-action-pins.sh fails the release if any reference here (or
# in the hand-written workflows) is not a 40-character SHA.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"          # v6
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"   # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"            # v4
