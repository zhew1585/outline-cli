# Publishing contract (SPEC.md): crate/package name is `outline-cli`
# (`otl` is taken on crates.io); only the binary is named `otl`.
[package]
name = "outline-cli"
version = "0.1.0"
description = "Outline CLI (otl): UX layer over the generic engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "otl"
path = "src/lib.rs"

[[bin]]
name = "otl"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[build-dependencies]
# `preserve_order` so the compiled IR keeps the spec's own property order:
# it is the schema's statement of which response fields matter most, and the
# table renderer ranks columns by it. Build-dependency features are not
# unified with normal dependencies under resolver 2, so the runtime
# `serde_json` keeps its default (sorted) map and response JSON output is
# unaffected.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
wiremock = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
