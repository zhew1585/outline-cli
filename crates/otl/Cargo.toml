# Publishing contract (SPEC.md): crate/package name is `outline-cli`
# (`otl` is taken on crates.io); only the binary is named `otl`.
[package]
name = "outline-cli"
version = "0.1.0"
description = "Outline CLI (otl): UX layer over the generic engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "otl"
path = "src/lib.rs"

[[bin]]
name = "otl"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
wiremock = { workspace = true }
unicode-width = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
