# Publishing contract (SPEC.md): crate/package name is `outline-cli`
# (`otl` is taken on crates.io); only the binary is named `otl`.
[package]
name = "outline-cli"
version = "0.1.0"
description = "Outline CLI (otl): UX layer over the generic engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "otl"
path = "src/lib.rs"

[[bin]]
name = "otl"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
spec-compile = { workspace = true }
anyhow = { workspace = true }
bincode = { workspace = true }
clap = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Atomic cache writes: exclusive creation with a random name in the target
# directory (a predictable temp name is a symlink/permission attack), 0600
# on Unix, and a persist() that replaces the target on Windows too - which
# std's rename does not.
tempfile = { workspace = true }
# Typed errors for the spec cache. anyhow stays the boundary type (main and
# the command layer); a cache failure needs to be inspectable - "stale" and
# "damaged" get different diagnostics - so it is a real enum.
thiserror = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[build-dependencies]
spec-compile = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
# Cache tests build a cache file byte by byte to pin its layout.
bincode = { workspace = true }
sha2 = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
wiremock = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
